<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>College Lost & Found Portal</title><link rel="stylesheet" href="style.css"></head><body><header><h1>College Lost & Found Portal</h1><p>Helping students recover their belongings</p></header><section class="container"><div class="form-box"><h2>Report an Item</h2><input id="name" placeholder="Item Name"><select id="type"><option>Lost</option><option>Found</option></select><input id="location" placeholder="Location"><input id="contact" placeholder="Contact Number"><button onclick="addItem()">Submit</button></div><div class="search"><input id="search" placeholder="Search Item..." onkeyup="searchItem()"></div><div id="items"></div></section><script src="script.js"></script></body></html>
